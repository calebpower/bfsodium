# bfsodium reaper tenant.
#
# Host execution rather than a container: the suite needs a C compiler (for the
# pinned interpreter and the lint) and the Cryptol toolchain plus z3 (the
# second oracle), and Cryptol ships as a release tarball rather than as a
# digest-pinned image we already trust. The guest is disposable, so installing
# both there is honest and reproducible; guest-setup.sh pins the Cryptol
# version explicitly.
schema = 1
project = "bfsodium"

# TWO GUESTS, AND THEY DO NOT RUN THE SAME SET OF CHECKS. That is unusual
# enough to justify here rather than in a commit message nobody will find.
#
# freebsd-15.1 exists for ONE reason: a second C compiler. There are five C
# programs in this repository -- bfi, hx, bflint, bfstyle, bffoot -- and until
# this guest every one of them had only ever been compiled by gcc. bfi is the
# interpreter every correctness claim in the library rests on. The sibling
# project's `bcmp` trap is the argument in full: clang rewrites
# memcmp(a, b, n) != 0 into a different symbol and gcc does not, and that was
# a defect nothing runnable on the development host could reveal.
#
# IT RUNS EVERYTHING THE OTHER GUEST RUNS. An earlier version of this comment
# said it skipped the design proofs because "the dual oracle's values are
# pinned literals that Cryptol computed once" -- which is FALSE, and tier 8 in
# tests/run.sh sets out why at length: tools/dkat.sh invokes `cryptol -b` ONCE
# PER VECTOR and compares the brainfuck against what the spec computes live.
# Taking Cryptol off this guest produced 156 failures in two tiers. So Cryptol
# is installed on both, and once it is there the proofs cost z3 invocations
# rather than a toolchain.
#
# Both guests therefore report the SAME COUNT. An asymmetric pair of summary
# lines is a symptom, not the design.
#
# security/hs-cryptol IS in ports, quarterly carries 3.4.0, and that is the
# version CRYPTOL_VERSION pins -- so this is a choice and not a limitation. An
# earlier version of this file claimed the latter and was wrong.
guests = ["ubuntu-26.04", "freebsd-15.1"]
exec = "host"

[build]
cmd = "sh tools/guest-setup.sh"

[run]
# No pipe into tee: /bin/sh may be dash (no pipefail, no PIPESTATUS) and the
# suite's exit status is the whole point. Redirect, capture the real status,
# echo the log for the live view, then re-raise.
cmd = "sh tests/run.sh > \"$REAPER_OUT\"/suite.log 2>&1; s=$?; cat \"$REAPER_OUT\"/suite.log; exit $s"

[sync]
# Never copy host-built binaries onto the guest: a FreeBSD-built bfi looks
# present to the suite's rebuild and then fails to exec. The guest builds its
# own from the committed C sources.
#
# AND NEVER COPY out/. It is gitignored, so nothing in it is part of what is
# being judged -- but .gitignore is not what rsync reads, and this list is.
# Left out, every run shipped whatever the working copy happened to have
# there: suite logs from earlier runs, the drawio exports, and at one point
# 392 MB of a container lane's scratch including a second copy of every .bf.
# The guest BUILDS out/ -- tools/dkbatch.sh writes out/cry.answers into it
# inside the run -- so sending one is not merely waste, it is uncommitted
# local state reaching the gate of record. The container lane never showed
# this because it does `rm -rf /work/out` after copying the tree in.
exclude = [
  "/out/",
  "/tools/bfi",
  "/tools/hx",
  "/tools/bflint",
  "/tools/bfstyle",
  "/tools/bffoot",
  "/.git/",
]

[resources]
cores = 2

# EIGHT, AND THE NUMBER IS MEASURED. It was 4, and at 4 both guests failed
# all three of tier 8a while the container lane was green -- which reads like
# a platform problem and is not one. tools/dkbatch.sh asks Cryptol every dual
# oracle question in ONE process, and that process peaks at 5,407,596 kB
# (5,280 MiB) of resident memory, sampled from its own VmHWM in the container
# lane. A guest with 4 GiB for the whole machine cannot hold it: cryptol dies
# partway, the answer file comes up short, dkbatch refuses to write it, and
# the two checks that read it fall with it.
#
# NOT A REGRESSION FROM ANY ONE COMMIT, which was worth establishing before
# raising a number to make a failure go away. With the sixteen AES-192/256
# vectors removed the same measurement gives 5,397,672 kB -- nine mebibytes
# less, 0.2%. The ceiling had been passed well before them and no run had
# said so, because this gate is run by hand.
#
# The cost is startup, not the questions: a cold cryptol is about 7.4 s and
# two hundred expressions in one process is about the same, so the batch
# exists to pay that once. The memory follows the spec being resident, which
# means this grows with the SPEC and not with the vector count -- a point
# worth remembering the next time a primitive is added rather than a vector.
ram_gb = 8
